name: release

on:
  push:
    tags:
      - "v*"

jobs:
  check:
    uses: ./.github/workflows/check.yml

  publish:
    needs: check

    permissions:
      # The GitHub release.
      contents: write
      # npm trusted publishing (OIDC); no npm token is stored.
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      # npm 12 has npm stage; Node 24's bundled npm may not.
      - name: Install npm 12
        run: npm i -g npm@12

      - name: Install corepack
        run: npm i -g corepack

      - name: Install dependencies
        run: yarn

      - name: Check the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      # The trusted publisher may only stage: a version goes live once it is
      # approved on npmjs.com with 2FA. Every fork version is a semver
      # prerelease (3.2.11-stesura.1), so the dist-tag is set explicitly.
      - name: Stage on npm
        run: npm stage publish . --tag latest

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
