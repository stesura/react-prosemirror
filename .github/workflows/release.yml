name: release

on:
  push:
    tags:
      - "v*"

jobs:
  check:
    uses: ./.github/workflows/check.yml

  publish:
    needs: check

    permissions:
      # The GitHub release.
      contents: write
      # npm trusted publishing (OIDC); no npm token is stored.
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Install corepack
        run: npm i -g corepack

      - name: Install dependencies
        run: yarn

      - name: Check the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      # Every fork version is a semver prerelease (3.2.11-stesura.1), so the
      # dist-tag is set explicitly: each one is the current release.
      - name: Publish to npm
        run: npm publish --tag latest

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
